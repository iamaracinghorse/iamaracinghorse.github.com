name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: music-box/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: music-box

      - name: Build music-box
        run: npm run build
        working-directory: music-box
        env:
          VITE_MUSICKIT_TOKEN: ${{ secrets.VITE_MUSICKIT_TOKEN }}

      - name: Assemble site
        run: |
          mkdir -p _site/music-box
          cp index.html _site/
          cp signature.html _site/
          cp signpost.css _site/
          cp -r venn-builder _site/venn-builder
          cp -r eote-flashcards _site/eote-flashcards
          cp -r music-box/dist/. _site/music-box/

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deployment
